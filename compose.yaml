services:
  jev-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      JEV_API_KEY: ${JEV_API_KEY:-dev-key-change-me}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_REPO: ${HF_REPO:-heman10x/openJev-verdict-2.0}
      MODEL_CACHE_DIR: /data/models
      BACKBONE_DIR: /app/vendor/modernbert
      JEV_DEVICE: cpu
      DOWNLOAD_ON_STARTUP: "true"
    volumes:
      - jev-model-cache:/data/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  jev-model-cache:
