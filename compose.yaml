services:
  jev-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      JEV_API_KEY: ${JEV_API_KEY:-dev-key-change-me}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-1.13.0}
      TYPESAFE_TIMEOUT: ${TYPESAFE_TIMEOUT:-120}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_REPO: ${HF_REPO:-wfzyx/von-1.0}
      VON_BACKEND: von
      GLINNER_BACKEND: ${GLINNER_BACKEND:-onnx}
      GLINNER_ONNX_VARIANT: ${GLINNER_ONNX_VARIANT:-fp32}
      GLINNER_HF_REPO: ${GLINNER_HF_REPO:-fastino/GLiNER2.5-Decide}
      PRELOAD_GLINNER: ${PRELOAD_GLINNER:-true}
      WARMUP_ON_STARTUP: ${WARMUP_ON_STARTUP:-true}
      KEEP_WARM_INTERVAL_S: ${KEEP_WARM_INTERVAL_S:-45}
      MODEL_CACHE_DIR: /data/models
      HF_HOME: /data/models
      JEV_DEVICE: cpu
      DOWNLOAD_ON_STARTUP: "true"
    volumes:
      - jev-model-cache:/data/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 300s

volumes:
  jev-model-cache:
