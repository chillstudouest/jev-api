services:
  jev-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      JEV_API_KEY: ${JEV_API_KEY:-dev-key-change-me}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_REPO: ${HF_REPO:-wfzyx/von-1.0}
      VON_BACKEND: von
      LAYA_HF_REPO: ${LAYA_HF_REPO:-convaiinnovations/laya}
      LAYA_SUBFOLDER: ${LAYA_SUBFOLDER:-}
      PRELOAD_LAYA: ${PRELOAD_LAYA:-false}
      MODEL_CACHE_DIR: /data/models
      HF_HOME: /data/models
      JEV_DEVICE: cpu
      DOWNLOAD_ON_STARTUP: "true"
    volumes:
      - jev-model-cache:/data/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 300s

volumes:
  jev-model-cache:
