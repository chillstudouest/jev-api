services:
  jev-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      JEV_API_KEY: ${JEV_API_KEY:-dev-key-change-me}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-1.13.0}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_REPO: ${HF_REPO:-wfzyx/von-1.0}
      VON_BACKEND: von
      LAYA_HF_REPO: ${LAYA_HF_REPO:-convaiinnovations/laya}
      LAYA_SUBFOLDER: ${LAYA_SUBFOLDER:-}
      PRELOAD_LAYA: ${PRELOAD_LAYA:-false}
      SEMIF_HF_REPO: ${SEMIF_HF_REPO:-Qwen/Qwen3.5-4B}
      SEMIF_REVISION: ${SEMIF_REVISION:-851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a}
      SEMIF_BACKEND: ${SEMIF_BACKEND:-auto}
      SEMIF_MODE: ${SEMIF_MODE:-auto}
      PRELOAD_SEMIF: ${PRELOAD_SEMIF:-false}
      SEMIF_SRC: /opt/semif
      MODEL_CACHE_DIR: /data/models
      HF_HOME: /data/models
      JEV_DEVICE: cpu
      DOWNLOAD_ON_STARTUP: "true"
    volumes:
      - jev-model-cache:/data/models
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 300s

volumes:
  jev-model-cache:
