name: base-image

# Builds and pushes the shared jev-api base image (python + torch CPU) to GHCR.
# The app Dockerfile does `FROM ghcr.io/chillstudouest/jev-api-base:<tag>` so that
# deploy builds never re-download/install torch.
# Bump BASE_TAG here and in Dockerfile when python/torch versions change.

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile.base
      - .github/workflows/base-image.yml

env:
  BASE_TAG: py3.12-torch-cpu
  IMAGE: ghcr.io/chillstudouest/jev-api-base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ env.IMAGE }}:${{ env.BASE_TAG }}
