[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-api"
version = "1.3.0"
description = "Jev-compatible System One HTTP API with switchable Von, Gliner, and Jev engines"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "torch>=2.2.0",
  "transformers>=4.48.0",
  "accelerate>=0.26.0",
  "huggingface_hub>=0.26.0",
  "von-sdk @ git+https://github.com/wfzyx/von.git",
  "gliner2>=2.0.0",
  "onnxruntime>=1.20.0",
  "tokenizers>=0.20.0",
  "peft>=0.13.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
jev-api = "jev_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
